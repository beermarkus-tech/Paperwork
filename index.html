<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Paperwork</title>
  <meta name="theme-color" content="#1a2b4a" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <header>
    <div id="header-title">
      <h1>Paperwork</h1>
      <p class="subtitle">v1.0 <span id="app-version"></span></p>
    </div>
    <div id="header-actions">
      <button id="batch-cancel-btn" type="button" aria-label="Cancel selection" hidden>&#10005;</button>
      <button id="change-folder-btn" type="button" aria-label="Choose a different folder">&#128193;</button>
      <button id="split-btn" type="button" aria-label="Split a PDF into pages" hidden>&#9986;&#65039;</button>
      <button id="join-btn" type="button" aria-label="Join PDFs into one" hidden>&#128279;</button>
    </div>
  </header>

  <main>
    <section id="setup">
      <button id="pick-folder-btn" type="button">Choose inbox folder&hellip;</button>
      <p id="status" role="status">No folder selected yet.</p>
      <progress id="progress" max="1" value="0" hidden></progress>
    </section>

    <section id="results" hidden>
      <div id="results-header">
        <h2 id="results-heading">PDFs found</h2>
      </div>
      <div id="thumbnail-strip"></div>
    </section>
  </main>

  <div id="batch-toast" hidden>
    <span id="batch-toast-text"></span>
    <button id="batch-toast-btn" type="button">Undo</button>
  </div>

  <div id="viewer" hidden>
    <div id="viewer-toolbar">
      <button id="viewer-close-btn" type="button" aria-label="Close viewer">&times;</button>
      <span id="viewer-indicator"></span>
    </div>
    <div id="viewer-stage">
      <span id="page-nav-prev" class="page-nav-arrow" aria-hidden="true" hidden>&#8249;</span>
      <div id="viewer-pages">
        <div class="page-slot" id="page-slot-1">
          <canvas id="viewer-canvas"></canvas>
          <div class="page-toolbar">
            <button id="viewer-rotate-btn" type="button" aria-label="Rotate page">&#8635;</button>
            <button id="delete-page-btn" type="button" aria-label="Delete page">&#128465;&#65039;</button>
          </div>
        </div>
        <div class="page-slot" id="page-slot-2" hidden>
          <canvas id="viewer-canvas-2"></canvas>
          <div class="page-toolbar">
            <button id="viewer-rotate-btn-2" type="button" aria-label="Rotate page">&#8635;</button>
            <button id="delete-page-btn-2" type="button" aria-label="Delete page">&#128465;&#65039;</button>
          </div>
        </div>
      </div>
      <span id="page-nav-next" class="page-nav-arrow page-nav-next" aria-hidden="true" hidden>&#8250;</span>
      <div id="undo-toast" hidden>
        <span id="undo-toast-text"></span>
        <button id="undo-toast-btn" type="button">Undo</button>
      </div>
    </div>
    <div id="rename-bar">
      <div id="rename-input-row">
        <button id="rename-date-btn" type="button" aria-label="Insert date">&#128197;</button>
        <input
          type="text"
          id="rename-input"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          aria-label="Filename"
        />
        <button id="rename-apply-btn" type="button" aria-label="Rename">&#10003;</button>
      </div>
      <div id="rename-chips-row">
        <div id="rename-chips"></div>
        <button id="edit-chips-btn" type="button" aria-label="Edit chip labels">&#9999;&#65039;</button>
      </div>
      <span id="rename-status" role="status"></span>
    </div>
    <div id="destination-bar-row">
      <div id="destination-bar"></div>
      <button id="edit-destinations-btn" type="button" aria-label="Edit destinations">&#9999;&#65039;</button>
    </div>
  </div>

  <div id="destinations-screen" class="sheet-overlay" hidden>
    <div id="destinations-sheet" class="sheet-card">
      <h2>Destination folders</h2>
      <p class="sheet-hint">Subfolders of your inbox you can file pages into with one tap. Created on disk as soon as you add them here.</p>
      <div id="destinations-list" class="settings-list"></div>
      <div class="settings-add-row">
        <input type="text" id="destinations-add-input" class="settings-add-input" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" aria-label="New destination name" placeholder="New folder name" />
        <button id="destinations-add-btn" type="button" class="settings-add-btn">Add</button>
      </div>
      <span id="destinations-status" class="settings-status" role="status"></span>
      <button id="destinations-done-btn" type="button">Done</button>
    </div>
  </div>

  <div id="chips-screen" class="sheet-overlay" hidden>
    <div id="chips-sheet" class="sheet-card">
      <h2>Chip labels</h2>
      <p class="sheet-hint">Quick words you can tap into the filename, below the date field.</p>
      <div id="chips-list" class="settings-list"></div>
      <div class="settings-add-row">
        <input type="text" id="chips-add-input" class="settings-add-input" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" aria-label="New chip label" placeholder="New label" />
        <button id="chips-add-btn" type="button" class="settings-add-btn">Add</button>
      </div>
      <span id="chips-status" class="settings-status" role="status"></span>
      <button id="chips-done-btn" type="button">Done</button>
    </div>
  </div>

  <div id="date-modal" hidden>
    <div id="date-modal-sheet">
      <div id="date-modal-header">
        <button id="date-modal-prev-btn" type="button" aria-label="Previous month">&#8249;</button>
        <span id="date-modal-title"></span>
        <button id="date-modal-next-btn" type="button" aria-label="Next month">&#8250;</button>
      </div>
      <div id="date-modal-grid"></div>
      <div id="date-modal-actions">
        <button id="date-modal-cancel-btn" type="button">Cancel</button>
        <button id="date-modal-ok-btn" type="button">OK</button>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
