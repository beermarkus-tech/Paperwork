<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Paperwork</title>
  <meta name="theme-color" content="#1a2b4a" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <header>
    <h1>Paperwork</h1>
    <p class="subtitle">Stage 4 &mdash; folder persistence, rename &amp; filing <span id="app-version"></span></p>
  </header>

  <main>
    <section id="setup">
      <button id="pick-folder-btn" type="button">Choose inbox folder&hellip;</button>
      <button id="change-folder-btn" type="button" hidden>Choose a different folder&hellip;</button>
      <button id="destinations-btn" type="button" hidden>Destinations&hellip;</button>
      <p id="status" role="status">No folder selected yet.</p>
      <progress id="progress" max="1" value="0" hidden></progress>
    </section>

    <section id="results" hidden>
      <h2>PDFs found</h2>
      <div id="thumbnail-strip"></div>
    </section>
  </main>

  <div id="viewer" hidden>
    <div id="viewer-toolbar">
      <button id="viewer-close-btn" type="button" aria-label="Close viewer">&times;</button>
      <span id="viewer-indicator"></span>
      <button id="viewer-rotate-btn" type="button" aria-label="Rotate page">&#8635;</button>
      <span id="viewer-save-status" class="save-status" hidden aria-live="polite"></span>
    </div>
    <div id="viewer-stage">
      <span id="page-nav-prev" class="page-nav-arrow" aria-hidden="true" hidden>&#8249;</span>
      <canvas id="viewer-canvas"></canvas>
      <span id="page-nav-next" class="page-nav-arrow page-nav-next" aria-hidden="true" hidden>&#8250;</span>
    </div>
    <div id="rename-bar">
      <div id="rename-input-row">
        <button id="rename-date-btn" type="button" aria-label="Insert date">&#128197;</button>
        <input
          type="text"
          id="rename-input"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          aria-label="Filename"
        />
        <button id="rename-apply-btn" type="button" aria-label="Rename">&#10003;</button>
      </div>
      <div id="rename-chips"></div>
      <span id="rename-status" role="status"></span>
    </div>
    <div id="destination-bar"></div>
    <p id="viewer-hint">Swipe &larr;&rarr; for pages &middot; &uarr;&darr; for documents &middot; pinch to zoom</p>
  </div>

  <div id="undo-toast" hidden>
    <span id="undo-toast-text"></span>
    <button id="undo-toast-btn" type="button">Undo</button>
  </div>

  <div id="destinations-screen" hidden>
    <div id="destinations-sheet">
      <h2>Destination folders</h2>
      <p id="destinations-hint">Subfolders of your inbox you can file pages into with one tap. Created on disk as soon as you add them here.</p>
      <div id="destinations-list"></div>
      <div id="destinations-add-row">
        <input type="text" id="destinations-add-input" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" aria-label="New destination name" placeholder="New folder name" />
        <button id="destinations-add-btn" type="button">Add</button>
      </div>
      <span id="destinations-status" role="status"></span>
      <button id="destinations-done-btn" type="button">Done</button>
    </div>
  </div>

  <div id="date-modal" hidden>
    <div id="date-modal-sheet">
      <div id="date-modal-header">
        <button id="date-modal-prev-btn" type="button" aria-label="Previous month">&#8249;</button>
        <span id="date-modal-title"></span>
        <button id="date-modal-next-btn" type="button" aria-label="Next month">&#8250;</button>
      </div>
      <div id="date-modal-grid"></div>
      <div id="date-modal-actions">
        <button id="date-modal-cancel-btn" type="button">Cancel</button>
        <button id="date-modal-ok-btn" type="button">OK</button>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
