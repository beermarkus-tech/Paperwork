<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Paperwork</title>
  <meta name="theme-color" content="#1a2b4a" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <header>
    <h1>Paperwork</h1>
    <p class="subtitle">Stage 3 &mdash; main viewer</p>
  </header>

  <main>
    <section id="setup">
      <button id="pick-folder-btn" type="button">Choose inbox folder&hellip;</button>
      <p id="status" role="status">No folder selected yet.</p>
      <progress id="progress" max="1" value="0" hidden></progress>
    </section>

    <section id="results" hidden>
      <h2>PDFs found</h2>
      <div id="thumbnail-strip"></div>
    </section>
  </main>

  <div id="viewer" hidden>
    <div id="viewer-toolbar">
      <button id="viewer-close-btn" type="button" aria-label="Close viewer">&times;</button>
      <span id="viewer-indicator"></span>
      <button id="viewer-rotate-btn" type="button" aria-label="Rotate page">&#8635;</button>
    </div>
    <div id="viewer-stage">
      <canvas id="viewer-canvas"></canvas>
    </div>
    <p id="viewer-hint">Swipe &larr;&rarr; for pages &middot; &uarr;&darr; for documents &middot; pinch to zoom</p>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
